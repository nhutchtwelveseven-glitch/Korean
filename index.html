<title>Korean Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4ECE7; --card:#FBFCFA; --ink:#1C2430; --muted:#5F6E69; --line:#C9D6CF;
  --celadon:#3F6E62; --celadon-soft:#D3E2DA; --seal:#B8322A;
  --serif:"Noto Serif KR","Apple SD Gothic Neo","AppleMyungjo",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131A19; --card:#1E2826; --ink:#E6EDEA; --muted:#93A39E; --line:#2E3B38;
    --celadon:#7FB3A4; --celadon-soft:#24332F; --seal:#E0574C;
  }
}
:root[data-theme="dark"]{
  --bg:#131A19; --card:#1E2826; --ink:#E6EDEA; --muted:#93A39E; --line:#2E3B38;
  --celadon:#7FB3A4; --celadon-soft:#24332F; --seal:#E0574C;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--celadon);outline-offset:3px}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 32px}
.hidden{display:none!important}

/* Home */
.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:12px 2px 18px;border-bottom:1px solid var(--line)}
.masthead h1{font-family:var(--serif);font-weight:800;font-size:2.6rem;line-height:1;margin:0;letter-spacing:-.02em}
.masthead p{margin:8px 0 0;color:var(--muted);font-size:.95rem}
.overall{font-family:var(--serif);font-size:1rem;color:var(--celadon);text-align:right;white-space:nowrap}
.overall b{display:block;font-size:1.8rem;font-weight:800;line-height:1}
.dirrow{display:flex;align-items:center;justify-content:space-between;padding:14px 2px;border-bottom:1px solid var(--line);font-size:.95rem;color:var(--muted)}
.seg{display:inline-flex;background:var(--celadon-soft);border-radius:999px;padding:3px}
.seg button{padding:7px 14px;border-radius:999px;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(20,40,35,.15)}
.sets{list-style:none;margin:0;padding:0}
.set{display:grid;grid-template-columns:3.2rem 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 2px;border-bottom:1px solid var(--line)}
.set .day{font-family:var(--serif);font-weight:600;font-size:1.35rem;color:var(--celadon);text-align:center}
.set .day small{display:block;font-family:var(--sans);font-size:.7rem;font-weight:400;color:var(--muted);margin-bottom:-2px}
.set .name{font-size:1.02rem;font-weight:500}
.set .bar{height:3px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.set .bar i{display:block;height:100%;background:var(--celadon);border-radius:2px}
.set .count{font-size:.85rem;color:var(--muted);min-width:3.2rem;text-align:right}
.set.done .count{color:var(--celadon);font-weight:600}
.foot{display:flex;justify-content:center;padding-top:22px}
.link{color:var(--muted);font-size:.85rem;text-decoration:underline;text-underline-offset:3px;padding:8px}

/* Study */
.study{display:flex;flex-direction:column;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0 14px}
.back{font-size:1rem;color:var(--celadon);padding:8px 4px}
.topbar .title{font-size:.95rem;color:var(--muted);text-align:center;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos{font-size:.95rem;color:var(--muted);min-width:3.5rem;text-align:right;font-variant-numeric:tabular-nums}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:22px}
.progress i{display:block;height:100%;width:0;background:var(--celadon);transition:width .25s ease}
.stage{flex:1;display:flex;align-items:center;justify-content:center;perspective:1400px;min-height:320px}
.card{position:relative;width:100%;max-width:440px;aspect-ratio:3/4;max-height:58vh;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.2,1)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:22px;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;box-shadow:0 18px 40px -24px rgba(30,60,52,.45)}
.face.back-face{transform:rotateY(180deg)}
.seal{position:absolute;top:18px;right:18px;width:42px;height:42px;border:2px solid var(--seal);color:var(--seal);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:800;font-size:1rem;transform:rotate(-6deg);opacity:.85}
.hint{position:absolute;bottom:18px;left:0;right:0;font-size:.8rem;color:var(--muted)}
.ko{font-family:var(--serif);font-weight:600;line-height:1.25;word-break:keep-all;overflow-wrap:anywhere}
.en{font-size:1.7rem;line-height:1.3;font-weight:500}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:22px}
.btn{padding:16px 10px;border-radius:14px;font-size:1.05rem;font-weight:600}
.btn.again{background:transparent;border:1.5px solid var(--seal);color:var(--seal)}
.btn.got{background:var(--celadon);color:var(--card)}
.btn.wide{grid-column:1/-1}
.btn:disabled{opacity:.35;cursor:default}

/* Results */
.result{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:10px 0}
.result .big{font-family:var(--serif);font-weight:800;font-size:4.5rem;line-height:1;color:var(--celadon)}
.result h2{font-family:var(--serif);font-weight:600;font-size:1.5rem;margin:14px 0 6px}
.result p{color:var(--muted);margin:0 0 26px}
.missed{list-style:none;margin:0 0 26px;padding:0;text-align:left;border-top:1px solid var(--line)}
.missed li{display:flex;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
.missed .k{font-family:var(--serif);font-weight:600}
.missed .e{color:var(--muted);text-align:right}
.stack{display:grid;gap:12px}

@media (prefers-reduced-motion:reduce){.card,.progress i{transition:none}}
</style>
</head>
<body>

<main class="wrap" id="home">
  <header class="masthead">
    <div>
      <h1>한국어</h1>
      <p>Twenty words a day for travelers</p>
    </div>
    <div class="overall"><b id="overallNum">0</b>of 500 learned</div>
  </header>
  <div class="dirrow">
    <span>Show first</span>
    <div class="seg" role="group" aria-label="Card front">
      <button id="dirKo" aria-pressed="true">Korean</button>
      <button id="dirEn" aria-pressed="false">English</button>
    </div>
  </div>
  <ul class="sets" id="setList"></ul>
  <div class="foot"><button class="link" id="resetAll">Reset all progress</button></div>
</main>

<main class="wrap study hidden" id="study">
  <div class="topbar">
    <button class="back" id="backBtn">‹ Days</button>
    <div class="title" id="studyTitle"></div>
    <div class="pos" id="pos"></div>
  </div>
  <div class="progress"><i id="progBar"></i></div>

  <div id="cardView" class="stage-wrap" style="display:flex;flex-direction:column;flex:1">
    <div class="stage">
      <button class="card" id="card" aria-label="Flip card">
        <div class="face front-face"><span class="seal" id="seal1"></span><div id="front"></div><span class="hint">Tap to flip</span></div>
        <div class="face back-face"><span class="seal" id="seal2"></span><div id="back"></div></div>
      </button>
    </div>
    <div class="actions">
      <button class="btn again" id="againBtn" disabled>Still learning</button>
      <button class="btn got" id="gotBtn" disabled>Got it</button>
    </div>
  </div>

  <div id="resultView" class="result hidden">
    <div class="big" id="resScore"></div>
    <h2 id="resTitle"></h2>
    <p id="resSub"></p>
    <ul class="missed" id="missedList"></ul>
    <div class="stack">
      <button class="btn got" id="reviewBtn">Review missed words</button>
      <button class="btn again" id="restartBtn">Study all 20 again</button>
      <button class="link" id="homeBtn">Back to days</button>
    </div>
  </div>
</main>

const KEY = "kflash-v1";
let state = {known:{}, dir:"ko"};
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.known) state = Object.assign(state, s); } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

const $ = id => document.getElementById(id);
let cur = {set:0, deck:[], i:0, missed:[], flipped:false};

function knownCount(si){ return (state.known[si]||[]).length; }

function renderHome(){
  const list = $("setList"); list.innerHTML = "";
  let total = 0;
  SETS.forEach((s, si) => {
    const k = knownCount(si); total += k;
    const li = document.createElement("li");
    li.innerHTML = `<button class="set ${k===20?'done':''}">
      <span class="day"><small>Day</small>${si+1}</span>
      <span><span class="name">${s.t}</span><span class="bar"><i style="width:${k/20*100}%"></i></span></span>
      <span class="count">${k===20?'Done':k+' / 20'}</span></button>`;
    li.firstElementChild.onclick = () => startSet(si);
    list.appendChild(li);
  });
  $("overallNum").textContent = total;
  $("dirKo").setAttribute("aria-pressed", state.dir==="ko");
  $("dirEn").setAttribute("aria-pressed", state.dir==="en");
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function startSet(si, indices){
  cur.set = si;
  cur.deck = shuffle(indices ? indices.slice() : [...Array(20).keys()]);
  cur.i = 0; cur.missed = [];
  $("studyTitle").textContent = `Day ${si+1} · ${SETS[si].t}`;
  $("seal1").textContent = $("seal2").textContent = si+1;
  $("home").classList.add("hidden");
  $("study").classList.remove("hidden");
  $("cardView").classList.remove("hidden");
  $("resultView").classList.add("hidden");
  window.scrollTo(0,0);
  showCard();
}

function koHTML(text){
  const len = text.replace(/\s/g,"").length;
  const size = len<=2 ? 5.2 : len<=4 ? 4.2 : len<=6 ? 3.2 : len<=9 ? 2.5 : 2;
  return `<div class="ko" style="font-size:${size}rem">${text}</div>`;
}
function enHTML(text){ return `<div class="en">${text}</div>`; }

function showCard(){
  const [ko, en] = SETS[cur.set].w[cur.deck[cur.i]];
  const card = $("card");
  card.style.transition = "none";
  card.classList.remove("flipped"); cur.flipped = false;
  void card.offsetWidth; card.style.transition = "";
  $("front").innerHTML = state.dir==="ko" ? koHTML(ko) : enHTML(en);
  $("back").innerHTML  = state.dir==="ko" ? enHTML(en) : koHTML(ko);
  $("pos").textContent = `${cur.i+1} / ${cur.deck.length}`;
  $("progBar").style.width = (cur.i/cur.deck.length*100)+"%";
  $("againBtn").disabled = $("gotBtn").disabled = true;
}

function flip(){
  cur.flipped = !cur.flipped;
  $("card").classList.toggle("flipped", cur.flipped);
  if (cur.flipped) $("againBtn").disabled = $("gotBtn").disabled = false;
}

function answer(got){
  const idx = cur.deck[cur.i];
  const k = new Set(state.known[cur.set]||[]);
  if (got) k.add(idx); else { k.delete(idx); cur.missed.push(idx); }
  state.known[cur.set] = [...k]; save();
  cur.i++;
  if (cur.i >= cur.deck.length) showResult(); else showCard();
}

function showResult(){
  $("progBar").style.width = "100%";
  $("cardView").classList.add("hidden");
  $("resultView").classList.remove("hidden");
  const n = cur.deck.length, got = n - cur.missed.length;
  $("resScore").textContent = `${got}/${n}`;
  const perfect = cur.missed.length===0;
  $("resTitle").textContent = perfect ? "잘했어요! Every word correct." : "Round complete";
  $("resSub").textContent = perfect
    ? (knownCount(cur.set)===20 ? `Day ${cur.set+1} is done. Come back tomorrow for Day ${Math.min(cur.set+2,25)}.` : "Nice work.")
    : `${cur.missed.length} word${cur.missed.length>1?'s':''} to go over again:`;
  const ml = $("missedList"); ml.innerHTML = "";
  ml.classList.toggle("hidden", perfect);
  cur.missed.forEach(i => {
    const [ko,en] = SETS[cur.set].w[i];
    ml.insertAdjacentHTML("beforeend", `<li><span class="k">${ko}</span><span class="e">${en}</span></li>`);
  });
  $("reviewBtn").classList.toggle("hidden", perfect);
  $("pos").textContent = "";
}

function goHome(){
  $("study").classList.add("hidden");
  $("home").classList.remove("hidden");
  renderHome(); window.scrollTo(0,0);
}

$("card").onclick = flip;
$("gotBtn").onclick = () => answer(true);
$("againBtn").onclick = () => answer(false);
$("backBtn").onclick = goHome;
$("homeBtn").onclick = goHome;
$("reviewBtn").onclick = () => startSet(cur.set, cur.missed);
$("restartBtn").onclick = () => startSet(cur.set);
$("dirKo").onclick = () => { state.dir="ko"; save(); renderHome(); };
$("dirEn").onclick = () => { state.dir="en"; save(); renderHome(); };
$("resetAll").onclick = () => { if (confirm("Clear progress for all 25 days?")) { state.known = {}; save(); renderHome(); } };
document.addEventListener("keydown", e => {
  if ($("study").classList.contains("hidden") || !$("resultView").classList.contains("hidden")) return;
  if (e.key===" "||e.key==="Enter"){ e.preventDefault(); flip(); }
  else if (cur.flipped && e.key==="ArrowRight") answer(true);
  else if (cur.flipped && e.key==="ArrowLeft") answer(false);
});

renderHome();
</script>
</body>
</html>
